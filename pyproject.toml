[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eight-puzzle-search"
version = "0.1.0"
description = "Classical search algorithms for square sliding puzzles"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py311"
extend-exclude = [
    "Node.py",
    "Expandation_*.py",
    "Test.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
